<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta
      name="description"
      content="Atlas interwencji w cechy rzadkiego autoenkodera modeli generujących muzykę symboliczną."
    >
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <title>Atlas cech SAE — muzyka symboliczna</title>
  </head>
  <body>
    <header class="hero">
      <div class="language-switch" aria-label="Language">
        <button class="language-button" type="button" data-language="pl">PL</button>
        <button class="language-button" type="button" data-language="en">EN</button>
      </div>
      <div class="eyebrow" data-text="heroEyebrow"></div>
      <h1 data-text="heroTitle"></h1>
      <p class="lead" data-text="heroLead"></p>
      <div class="stats">
        <div class="stat"><b>80</b><span data-text="statFeatures"></span></div>
        <div class="stat"><b>15</b><span data-text="statMuspy"></span></div>
        <div class="stat"><b>27</b><span data-text="statInstruments"></span></div>
        <div class="stat"><b>48</b><span data-text="statQualitative"></span></div>
        <div class="stat"><b>3</b><span data-text="statDoses"></span></div>
      </div>
    </header>

    <section class="method">
      <details>
        <summary data-text="methodSummary"></summary>
        <div class="method-grid" id="methodGrid"></div>
      </details>
    </section>

    <div class="toolbar">
      <div class="filters">
        <input id="search" type="search">
        <select id="category"></select>
        <select id="model"></select>
        <select id="status"></select>
        <span id="result-count"></span>
        <div class="toolbar-language" aria-label="Language">
          <button class="language-button" type="button" data-language="pl">PL</button>
          <button class="language-button" type="button" data-language="en">EN</button>
        </div>
      </div>
    </div>

    <main>
      <p class="availability-note" data-text="availabilityNote"></p>
      <div id="cards"></div>
    </main>

    <footer class="footer">
      <button class="export" id="export" data-text="exportButton"></button>
      <p data-text="footerAudio"></p>
      <p data-text="footerIdentity"></p>
    </footer>

    <script src="library.js"></script>
    <script src="script.js"></script>
  </body>
</html>
