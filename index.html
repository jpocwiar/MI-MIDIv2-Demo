<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta
      name="description"
      content="MI-MIDI — próbki dźwiękowe dla interwencji w cechy rzadkich autoenkoderów modeli text-to-MIDI."
    >
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles.css">
    <title>MI-MIDI — interwencje w cechy rzadkich autoenkoderów</title>
  </head>
  <body>
    <header class="hero">
      <div class="language-switch" aria-label="Language">
        <button class="language-button" type="button" data-language="pl">PL</button>
        <button class="language-button" type="button" data-language="en">EN</button>
      </div>
      <div class="eyebrow" data-text="heroEyebrow"></div>
      <h1>MI-MIDI</h1>
      <p class="hero-section" data-text="heroSection"></p>
      <p class="lead" data-text="heroLead"></p>
    </header>

    <section class="guide" aria-labelledby="guideTitle">
      <div class="guide-copy">
        <h2 id="guideTitle" data-text="guideTitle"></h2>
        <p data-text="guideText"></p>
      </div>
      <div class="comparison-key" id="guideGrid"></div>
    </section>

    <section class="usage">
      <div class="usage-panel">
        <h2 data-text="usageTitle"></h2>
        <p data-text="usageText"></p>
      </div>
      <div class="legend-panel">
        <h2 data-text="legendTitle"></h2>
        <div class="status-legend" id="statusLegend"></div>
      </div>
    </section>

    <div class="toolbar">
      <div class="filters">
        <input id="search" type="search">
        <select id="category"></select>
        <select id="model"></select>
        <select id="status"></select>
        <span id="result-count" aria-live="polite"></span>
        <div class="toolbar-language" aria-label="Language">
          <button class="language-button" type="button" data-language="pl">PL</button>
          <button class="language-button" type="button" data-language="en">EN</button>
        </div>
      </div>
    </div>

    <main>
      <div id="cards"></div>
    </main>

    <footer class="footer">
      <a href="https://jpocwiar.github.io/MI-MIDI-Demo/" data-text="interventionsLink"></a>
      <a href="SOUNDFONT_LICENSE.md" data-text="licenseLink"></a>
    </footer>

    <script src="library.js"></script>
    <script src="script.js"></script>
  </body>
</html>
